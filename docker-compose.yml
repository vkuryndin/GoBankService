services:
  bank-postgres:
    image: postgres:17-alpine
    container_name: bank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bank_service
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - bank_postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_user -d bank_service"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bank_network

  bank-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      bank-postgres:
        condition: service_healthy
    networks:
      - bank_network

  bank-nginx:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: bank-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    depends_on:
      - bank-api
    networks:
      - bank_network

volumes:
  bank_postgres_data:

networks:
  bank_network:
    driver: bridge

version: "2"

run:
  timeout: 5m
  tests: true
  go: "1.23"
  relative-path-mode: gomod
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - errorlint
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - noctx
    - gosec
    - nilerr
    - nilnil
    - wastedassign
    - unconvert
    - misspell

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - noctx

issues:
  max-issues-per-linter: 0
  max-same-issues: 0